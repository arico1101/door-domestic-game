<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トビラ — おかねと選択肢の人生すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F2F9FD; --card:#FFFFFF; --ink:#3F5266; --sub:#8A97A5; --line:#E3EDF4;
  --pink:#F4879F; --gold:#FBD96B; --btn:#5B7FA8; --btn-d:#43617F;
  --money:#D9A32B; --learn:#4E8FC0; --happy:#E4708F;
  --ok:#86D9A5; --lock:#FFC98C; --unseen:#B7A6EA;
  --wrap:1180px;
  --sh:0 4px 16px rgba(63,82,102,.10);
  --sh-s:0 2px 8px rgba(63,82,102,.10);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
/* 数字はそろえて読ませる（以前は数値だけ別の書体にしていたが、書体はZen Maruに一本化した） */
body{
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  background:var(--page); color:var(--ink); line-height:1.8;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer; border:none;}
.screen{display:none; min-height:100vh;}
.screen.active{display:block;}
.ic{width:1.05em; height:1.05em; vertical-align:-.16em; flex:none;}
.ic.s{width:.92em; height:.92em;}

/* ---------- セットアップ ---------- */
#setup{display:none; place-items:center; padding:26px 18px;}
#setup.active{display:grid;}
.setup-card{width:min(520px,100%); margin:0 auto; text-align:center;}
.title-door{width:104px; height:128px; margin:0 auto 14px; position:relative;
  background:var(--pink); border-radius:52px 52px 10px 10px; display:grid; place-items:center;
  box-shadow:0 6px 0 rgba(214,104,130,.4);}
.title-door .leaf{width:82px; height:106px; border-radius:41px 41px 7px 7px; background:#FBD96B;
  position:relative; transition:transform .6s cubic-bezier(.2,.8,.3,1.2); transform-origin:left center;}
.title-door:hover .leaf{transform:perspective(400px) rotateY(-36deg);}
.title-door .knob{position:absolute; right:12px; top:56px; width:11px; height:11px;
  border-radius:50%; background:var(--btn);}
h1.game-title{font-size:clamp(32px,8vw,48px); font-weight:900; letter-spacing:.1em;}
.game-sub{font-size:14px; font-weight:700; color:var(--sub); margin:6px 0 24px;}
.player-inputs{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.p-row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px;
  padding:9px 14px; box-shadow:var(--sh-s);}
.p-dot{width:20px; height:20px; border-radius:50%; flex:none;}
/* セットアップの行にも、その人のキャラ絵を出す（盤面のコマと同じ顔） */
.p-av{width:34px; height:34px; border-radius:50%; flex:none; border:2.5px solid var(--line);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.p-row input{flex:1; border:none; outline:none; font-family:inherit; font-size:16px;
  font-weight:700; color:var(--ink); background:transparent; min-width:0;}
.p-row .rm{background:transparent; font-size:17px; color:var(--happy); font-weight:900; padding:2px 6px;}
.row-btns{display:flex; gap:10px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;}
.chip-btn{background:var(--card); border-radius:999px; padding:8px 18px; font-weight:700;
  font-size:13.5px; color:var(--ink); box-shadow:var(--sh-s);
  display:inline-flex; align-items:center; gap:6px;}
.chip-btn.on{background:var(--gold); color:#7A6320;}
.fac-toggle{display:flex; align-items:flex-start; gap:9px; text-align:left; background:var(--card);
  border-radius:16px; padding:12px 15px; font-size:12.5px; font-weight:700; line-height:1.7;
  margin:0 auto 20px; width:min(440px,100%); cursor:pointer; box-shadow:var(--sh-s);}
.fac-toggle input{width:18px; height:18px; margin-top:3px; accent-color:var(--pink); flex:none;}
.fac-toggle small{color:var(--sub);}
.big-btn{display:inline-block; background:var(--pink); color:#fff; font-size:18px; font-weight:900;
  padding:15px 42px; border-radius:999px; letter-spacing:.08em; box-shadow:0 5px 0 #D66882;
  transition:transform .08s;}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #D66882;}
.setup-note{margin-top:16px; font-size:12.5px; line-height:1.85; color:var(--sub); font-weight:700;}

/* ---------- ゲーム画面 ---------- */
#game{padding:0 0 96px;}
/* PCは1画面におさめる。盤面は横:縦の比が決まっているので、残りの高さから横幅を決める。
   ヘッダー・サイコロ・余白でおよそ 244px ぶんを引いている */
@media (min-width:701px){
  /* --board-aspect は盤面の縦横比。描くたびに JS が入れかえる（36マス=1.386） */
  :root{--wrap:min(1700px, calc((100vh - 244px) * var(--board-aspect, 1.386) + 24px));}
}
.sticky-head{position:sticky; top:0; z-index:40; background:var(--page);
  padding:10px 12px 8px; box-shadow:0 8px 12px -10px rgba(63,82,102,.3);}
.topbar{display:flex; align-items:center; gap:9px; max-width:var(--wrap); margin:0 auto 9px;}
.topbar .logo{font-weight:900; font-size:17px; letter-spacing:.08em; color:var(--pink); flex:none;}
.turn-pill{flex:1; min-width:0; display:flex; align-items:center; gap:9px;
  background:color-mix(in srgb, var(--ring, var(--pink)) 17%, #fff);
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--ring, var(--pink)) 45%, #fff);
  border-radius:999px; padding:6px 14px; font-weight:900; font-size:clamp(13px,2.4vw,15px);
  overflow:hidden;}
.turn-pill .av{width:28px; height:28px; border-radius:50%; flex:none;
  border:2px solid var(--ring, var(--pink));
  background-color:#fff; background-size:cover; background-position:center 16%;}
.turn-pill .tp-txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.help-btn{height:40px; border-radius:999px; background:var(--card); display:inline-flex;
  align-items:center; justify-content:center; gap:6px; padding:0 15px; color:var(--btn);
  box-shadow:var(--sh-s); flex:none;}
.help-btn .ic{width:21px; height:21px;}
.help-btn .lbl{font-size:12.5px; font-weight:900; color:var(--ink); white-space:nowrap;}
.help-btn:active{transform:translateY(1px);}
.players-strip{display:flex; gap:8px; overflow-x:auto; max-width:var(--wrap); margin:0 auto;
  padding:2px 2px 6px;}
.pcard{flex:1 0 156px; background:var(--card); border-radius:15px; padding:8px 11px;
  box-shadow:var(--sh-s); display:flex; gap:9px; align-items:center; opacity:.72; transition:opacity .2s;}
.pcard.now{opacity:1; box-shadow:0 0 0 2.5px var(--ring, var(--pink)), var(--sh-s);}
.pcard.done{opacity:.45;}
.pcard .av{width:38px; height:38px; border-radius:50%; flex:none; border:2.5px solid var(--line);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.pcard .nm{font-size:12.5px; font-weight:900; line-height:1.35; display:flex; align-items:center; gap:5px;}
.pcard .age{font-size:10.5px; font-weight:700; color:var(--sub); white-space:nowrap;}
.pcard .row{display:flex; gap:8px; font-size:11px; font-weight:900; margin-top:1px;}
/* 「195万」がスマホで折り返さないように、1項目は必ず1行で出す */
.pcard .row span{display:inline-flex; align-items:center; gap:2px; white-space:nowrap;}
.m1{color:var(--money);} .m2{color:var(--learn);} .m3{color:var(--happy);}
.m1.neg{color:#C25B5B;}
.board-wrap{max-width:var(--wrap); margin:10px auto 0; padding:0 12px;}
#board{display:block; width:100%; height:auto; border-radius:18px;}
.controls{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; z-index:50; pointer-events:none;
  background:linear-gradient(transparent,rgba(242,249,253,.9) 40%);}
.dice-btn{pointer-events:auto; background:var(--btn); color:#fff; font-size:17px; font-weight:900;
  letter-spacing:.06em; padding:14px 40px; border-radius:999px; box-shadow:0 5px 0 var(--btn-d);
  display:flex; align-items:center; gap:11px; transition:transform .08s;}
.dice-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-d);}
.dice-btn:disabled{opacity:.5; cursor:default;}
.dice-face{background:#fff; border-radius:11px; width:38px; height:38px; display:grid;
  grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:6px; gap:1px;}
.dice-face span{display:grid; place-items:center;}
.dice-face i{width:6px; height:6px; border-radius:50%; background:var(--pink);}

/* ---------- サイコロの演出 ---------- */
.dice-stage{position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; background:rgba(242,249,253,.72);
  backdrop-filter:blur(2px); pointer-events:none;}
.dice-stage.on{display:flex;}
/* 立体のサイコロ。6面ぶんの面を組んで、本体ごと転がす。
   出目は「その面が正面を向く向き」に本体を回して見せる（JS の FACE_ROT） */
.die-scene{--die:min(160px,38vw); width:var(--die); aspect-ratio:1; perspective:760px;}
.die-scene.land{animation:bigLand .5s cubic-bezier(.2,1.4,.4,1);}
.big-die{width:100%; height:100%; position:relative; transform-style:preserve-3d;}
.big-die .face{position:absolute; inset:0; background:#fff; border-radius:24px;
  border:2px solid #E8F0F6; box-shadow:inset 0 -6px 0 rgba(63,82,102,.07);
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:15px; gap:4px; backface-visibility:hidden;}
.big-die .f1{transform:                translateZ(calc(var(--die) / 2));}
.big-die .f2{transform:rotateY(90deg)  translateZ(calc(var(--die) / 2));}
.big-die .f3{transform:rotateX(90deg)  translateZ(calc(var(--die) / 2));}
.big-die .f4{transform:rotateX(-90deg) translateZ(calc(var(--die) / 2));}
.big-die .f5{transform:rotateY(-90deg) translateZ(calc(var(--die) / 2));}
.big-die .f6{transform:rotateY(180deg) translateZ(calc(var(--die) / 2));}
.big-die span{display:grid; place-items:center;}
.big-die i{width:22%; aspect-ratio:1; min-width:12px; border-radius:50%; background:var(--pink);}
.big-die.roll{animation:bigTumble 1.5s linear infinite;}
.big-die.land{transition:transform .6s cubic-bezier(.2,.85,.3,1.15);}
@keyframes bigTumble{from{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg)}
  to{transform:rotateX(720deg) rotateY(1080deg) rotateZ(360deg)}}
@keyframes bigLand{0%{transform:scale(1.22)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.die-msg{font-size:clamp(19px,4.6vw,26px); font-weight:900; color:var(--ink); letter-spacing:.06em;
  min-height:1.6em;}

/* ---------- モーダル ---------- */
.overlay{position:fixed; inset:0; background:rgba(63,82,102,.42); z-index:100;
  display:none; place-items:center; padding:16px;}
.overlay.open{display:grid;}
.modal{width:min(420px,100%); max-height:88vh; overflow-y:auto; background:var(--card);
  border-radius:24px; box-shadow:0 12px 36px rgba(63,82,102,.28);
  animation:pop .26s cubic-bezier(.2,.8,.3,1.2);}
.modal.wide{width:min(620px,100%);}
@keyframes pop{from{transform:scale(.88); opacity:0} to{transform:scale(1); opacity:1}}
.m-head{padding:18px 20px 15px; text-align:center;}
.m-tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:900;
  letter-spacing:.1em; padding:4px 13px; border-radius:999px; color:#fff;}
.modal h2{font-size:clamp(19px,4.4vw,23px); font-weight:900; margin-top:9px; line-height:1.45;}
.m-sub{font-size:12px; font-weight:700; color:var(--sub);}
.m-body{padding:4px 20px 20px;}
.m-lead{font-size:13px; font-weight:700; color:#54677A; text-align:center; line-height:1.85;
  margin-bottom:14px;}
.m-note{background:#F7FBFD; border-radius:14px; padding:11px 14px; font-size:12.5px;
  font-weight:700; line-height:1.8; margin-bottom:13px;}
.m-note.priv{background:#FBF4FB;}
.m-btn{display:block; width:100%; background:var(--btn); color:#fff; font-size:15px; font-weight:900;
  padding:13px; border-radius:999px; margin-top:6px; box-shadow:0 4px 0 var(--btn-d); transition:transform .08s;}
.m-btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--btn-d);}
.m-btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--sh-s);}
.fx-line{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:12px 0 14px;}
.fx{background:#F7FBFD; border-radius:999px; padding:4px 14px; font-weight:900; font-size:14px;
  display:inline-flex; align-items:center; gap:4px;}
.big-amount{text-align:center; font-size:28px; font-weight:900; margin:10px 0 14px;}

/* 選択肢（トビラ）。どれも同じ青のボタン。開くかどうかは押すまで分からない */
.door-list{display:flex; flex-direction:column; gap:9px;}
.door{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  border-radius:16px; padding:13px 16px;
  transition:background .14s, transform .08s; background:#E8F0F8; color:var(--ink);
  box-shadow:inset 0 0 0 2px #DAE7F3; --leaf-fill:#E8F0F8;}
/* トビラの目じるし。文字は置かず、アイコンだけを大きく左に。
   わく（奥）と扉（手前）を重ねて置き、ホバーすると扉だけが手前にひらく。
   タイトルのトビラと同じ動き。閉じているあいだ扉はボタンと同じ色で、
   ひらくと奥のくらがりが見える */
.d-mark{flex:none; display:grid; place-items:center; width:30px; height:30px; color:#4B6E93;}
.d-mark .ic{grid-area:1 / 1; width:30px; height:30px;}
.d-mark .leaf{transform-origin:25% 50%; transition:transform .42s cubic-bezier(.2,.8,.3,1.2);}
.door.pick:hover .d-mark .leaf,
.door.pick:focus-visible .d-mark .leaf{transform:perspective(140px) rotateY(-58deg);}
.d-mark.unseen{color:#6E5BA8;}
.d-main{flex:1; min-width:0;}
.door.pick{cursor:pointer;}
.door.pick:hover{background:#DBE9F7; box-shadow:inset 0 0 0 2px #BED4EA; --leaf-fill:#DBE9F7;}
.door:not(:disabled):active{transform:translateY(2px);}
@media (prefers-reduced-motion:reduce){ .d-mark .leaf{transition:none;} }
/* 押したあとの確認 */
.c-card{border-radius:18px; padding:14px 16px; margin-bottom:15px;}
.c-card.ok{background:#EAF6EF; box-shadow:inset 0 0 0 2px #C9E7D6;}
.c-card.ng{background:#FAEEE9; box-shadow:inset 0 0 0 2px #EFD7CB;}
.c-title{font-size:17px; font-weight:900; line-height:1.5; margin-bottom:3px;}
.c-key{margin-top:9px; font-size:12.5px; font-weight:900; color:#7A5E2E; line-height:1.7;}
.c-key .c-now{display:block; font-size:11.5px; font-weight:700; color:var(--sub);}
.c-key .m1, .c-key .m2{display:inline-flex; align-items:center; gap:2px; font-weight:900;}
.c-ask{text-align:center; font-size:14.5px; font-weight:900; margin:4px 0 12px; line-height:1.7;}
.c-ask.ng{color:#B4643C; font-size:13.5px; display:flex; align-items:center;
  justify-content:center; gap:6px; flex-wrap:wrap;}
.d-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:900;
  letter-spacing:.04em; border-radius:999px; padding:2px 10px; margin-bottom:6px;}
.d-badge.plain{background:#D6E5F4; color:#4B6E93;}
.d-badge.open{background:#CFEBDC; color:#3B7E58;}
.d-badge.lock{background:#F6DFD2; color:#B4682F;}
.d-badge.unseen{background:#E8E2F7; color:#6E5BA8;}
/* トビラの画面に置く、画面上部とおなじプレイヤーカード。
   ここは手もとを確かめる場所なので、上のバーより文字を大きくする。
   枠は外に出る影ではなく内側の線にして、下のトビラのボタンと横幅をそろえる */
.pcard.m-pcard{opacity:1; margin-bottom:13px; padding:12px 16px; border-radius:16px; gap:11px;
  box-shadow:inset 0 0 0 2.5px var(--ring, var(--pink)), var(--sh-s);}
.pcard.m-pcard .av{width:46px; height:46px;}
.pcard.m-pcard .nm{font-size:15px; gap:6px;}
.pcard.m-pcard .age{font-size:12.5px;}
.pcard.m-pcard .row{font-size:15px; gap:13px; margin-top:3px;}
.door .d-title{display:block; font-size:15px; font-weight:900; line-height:1.45;}
.door .d-desc{display:block; font-size:11.5px; font-weight:700; color:#6E7E8C; margin-top:3px; line-height:1.65;}
.door .d-key{display:flex; font-size:11.5px; font-weight:900; margin-top:7px;
  align-items:center; gap:4px; flex-wrap:wrap;}
.door.unseen{background:repeating-linear-gradient(45deg,#F1F3F5,#F1F3F5 9px,#EAEEF1 9px,#EAEEF1 18px);
  cursor:not-allowed; box-shadow:none;}
.door.unseen .d-title{color:#9AA7B2; letter-spacing:.16em;}
.door.unseen .d-desc{color:#AEB9C2;}
.d-cost{font-size:13px; font-weight:900; margin-top:8px; display:flex; align-items:center; gap:5px;}
.d-cost.minus{color:#C25B5B;} .d-cost.plus{color:#4FA85E;}
.d-cost s{opacity:.55; margin-right:3px; font-weight:700;}

/* ステータス変化 */
.chg-body{display:flex; gap:13px; align-items:center; padding:2px 0 6px;}
.chg-char{width:74px; height:98px; flex:none; background-size:contain;
  background-repeat:no-repeat; background-position:center bottom;}
.chg-rows{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
.chg-r{display:grid; grid-template-columns:58px 1fr auto; align-items:center; gap:8px;
  border-radius:12px; padding:8px 12px;}
.chg-r.money{background:#FFF4DC;} .chg-r.money .k{color:#B98A2A;}
.chg-r.learn{background:#E7F2FC;} .chg-r.learn .k{color:#3F7EAC;}
.chg-r.happy{background:#FDECF2;} .chg-r.happy .k{color:#CE6288;}
.chg-r .k{font-size:11px; font-weight:900;}
.chg-r .v{font-size:14.5px; font-weight:900; display:flex; align-items:center; gap:3px;}
.chg-r .v s{color:#B4C1CB; font-weight:700; margin-right:3px; display:inline-flex; align-items:center; gap:2px;}
.chg-r .d{font-size:13.5px; font-weight:900;}
.up{color:#4FA85E;} .dn{color:#D9737B;}

/* 家庭カード */
/* 上の帯は、そのカードを見ている本人の色。盤面のコマ・上部の手番表示とそろえる */
.fam-top{padding:16px 18px 14px; display:flex; gap:13px; align-items:center;
  background:linear-gradient(120deg,
    color-mix(in srgb, var(--fam, var(--pink)) 92%, var(--ink)),
    color-mix(in srgb, var(--fam, var(--pink)) 74%, var(--ink)));}
.fam-top .av{width:60px; height:60px; border-radius:50%; flex:none; border:3px solid #fff;
  background-color:#fff; background-size:cover; background-position:center 16%;
  box-shadow:0 2px 8px rgba(63,82,102,.22);}
.fam-top .pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900;
  letter-spacing:.08em; background:rgba(255,255,255,.92); border-radius:999px; padding:2px 10px; margin-bottom:5px;}
.fam-top .nm{font-size:16.5px; font-weight:900; line-height:1.45; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.15);}
.fam-story{font-size:12.5px; font-weight:700; line-height:1.9; color:#54677A;
  background:#F7FBFD; border-radius:14px; padding:12px 14px;}
.fam-line{font-size:11.5px; font-weight:700; color:#7C8B99; margin-top:9px; line-height:1.75;
  display:flex; align-items:flex-start; gap:5px;}
.fam-line b{color:#4A3A30; font-size:12.5px;}
.fam-line .note{color:#C4788A;}
/* カードの中の「いまのステータス」と「トビラの記録」 */
.now-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px;}
.ns{border-radius:13px; padding:8px 10px 9px;}
.ns.money{background:#FFF4DC;} .ns.learn{background:#E7F2FC;} .ns.happy{background:#FDECF2;}
.ns .k{display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:900;}
.ns.money .k{color:#B98A2A;} .ns.learn .k{color:#3F7EAC;} .ns.happy .k{color:#CE6288;}
.ns .v{font-size:17px; font-weight:900; line-height:1.4;}
.now-doors{margin-top:9px; background:#F7FBFD; border-radius:13px; padding:9px 12px;}

.rule-page{position:relative; text-align:left; padding:20px; display:flex; flex-direction:column;}

<script>
"use strict";
/* ===================== 効果音 =====================
   音のファイルは持たない。鳴らすたびに WebAudio で組み立てる。
   せかい版はESモジュールだが、国内版は file:// でそのまま開けることを優先して
   index.html の中に素のスクリプトとして取りこんでいる。 */
const SE = (()=>{
  const KEY = "tobira-se";
  let on = true;
  try{ on = localStorage.getItem(KEY) !== "off"; }catch{}
  let ctx = null;
  const isOn = ()=>on;
  function setOn(v){
    on = !!v;
    try{ localStorage.setItem(KEY, on ? "on" : "off"); }catch{}
    if(on) resume();
  }
  function toggle(){ setOn(!on); return on; }
  /* 音が出せる状態の AudioContext を返す。出せないときは null（無音のまま進む） */
  function ac(){
    if(!on) return null;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!ctx) ctx = new AC();
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch{ return null; }
  }
  function resume(){ ac(); }
  /* ひとつの音。山なりの音量にして、ブツッと切れないようにする */
  function tone(c, {f, to, at=0, dur=.12, type="sine", vol=.16}){
    const t0 = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if(to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(.02, dur/3));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + .03);
  }
  /* ざらっとした音（サイコロのころがり、紙をめくる感じ） */
  function noise(c, {at=0, dur=.12, vol=.1, f=1400, q=.7}){
    const t0 = c.currentTime + at;
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(bp).connect(g).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur + .02);
  }
  /* 音階を順に鳴らす（ファンファーレなど） */
  function seq(c, notes, {dur=.13, type="triangle", vol=.16, gap=.09}={}){
    notes.forEach((f,i)=>tone(c, {f, at:i*gap, dur, type, vol}));
  }
  /* ドレミ。数字のままだと読めないので名前で置く */
  const N = {C4:261.6, E4:329.6, G4:392, A4:440, C5:523.3, D5:587.3, E5:659.3,
             G5:784, A5:880, C6:1046.5, E6:1318.5, G6:1568};
  const SOUNDS = {
    tap:   c=>tone(c, {f:N.A5, dur:.06, type:"triangle", vol:.1}),
    pop:   c=>{ tone(c, {f:N.D5, dur:.1, type:"triangle", vol:.13});
                tone(c, {f:N.A5, at:.06, dur:.12, type:"triangle", vol:.12}); },
    roll:  c=>[0,.12,.24,.36].forEach(at=>noise(c, {at, dur:.1, vol:.09, f:1800})),
    land:  c=>{ tone(c, {f:180, to:90, dur:.16, type:"square", vol:.12});
                tone(c, {f:N.G5, at:.1, dur:.14, type:"triangle", vol:.14}); },
    step:  c=>tone(c, {f:N.E5, dur:.05, type:"sine", vol:.07}),
    door:  c=>{ tone(c, {f:320, dur:.08, type:"sine", vol:.13});
                tone(c, {f:260, at:.11, dur:.1, type:"sine", vol:.13}); },
    unlock:c=>{ noise(c, {dur:.07, vol:.07, f:2600});
                seq(c, [N.E5,N.A5], {dur:.12, gap:.07, vol:.15}); },
    locked:c=>{ tone(c, {f:210, to:130, dur:.22, type:"sawtooth", vol:.1});
                tone(c, {f:150, at:.05, dur:.16, type:"square", vol:.07}); },
    open:  c=>seq(c, [N.C5,N.E5,N.G5,N.C6], {dur:.14, gap:.07, vol:.15}),
    good:  c=>seq(c, [N.E5,N.G5,N.C6], {dur:.14, gap:.08, vol:.15}),
    bad:   c=>{ tone(c, {f:N.A4, to:N.E4, dur:.26, type:"triangle", vol:.13});
                tone(c, {f:220, at:.12, dur:.22, type:"sine", vol:.1}); },
    card:  c=>{ noise(c, {dur:.16, vol:.08, f:900, q:.5});
                tone(c, {f:N.G4, to:N.D5, dur:.18, type:"sine", vol:.1}); },
    goal:  c=>seq(c, [N.C5,N.E5,N.G5,N.C6], {dur:.18, gap:.1, vol:.16}),
    result:c=>{ seq(c, [N.C5,N.E5,N.G5,N.C6,N.G5,N.C6], {dur:.2, gap:.12, vol:.16});
                [N.E6,N.G6].forEach((f,i)=>tone(c, {f, at:.72 + i*.1, dur:.3, type:"sine", vol:.1})); },
  };
  /* 場面の名前で鳴らす。名前がなければ何も鳴らさない（音で進行を止めない） */
  function play(name){
    const c = ac();
    const make = SOUNDS[name];
    if(!c || !make) return;
    try{ make(c); }catch{}
  }
  return {isOn, setOn, toggle, resume, play};
})();

   マスをマス目に並べるのではなく、1本の道を36等分してタイルに切る。

const NS = "http://www.w3.org/2000/svg";
const el = (t,a)=>{ const e = document.createElementNS(NS,t); for(const k in a) e.setAttribute(k, a[k]); return e; };

/* 盤面の道。マスの数だけ等分して切るので、段の数ぶんだけ折れ線を用意する。
   36マス・6章なので PC 6段・スマホ 12段（1章＝6マス／PCは1段＝1章）。
   道の折れ線は「Uターンがちょうど半分で切れて、切り口が水平になる」ように
   1段目と最終段だけ左へ66のばしてある。 */
const LAY_WIDE = {
  vb:[1780,1284], corner:100, skyH:84, artH:250, aspect:1.386,
  pts:[[106,150],[1672,150],[1672,360],[172,360],[172,570],[1672,570],
       [1672,780],[172,780],[172,990],[1672,990],[1672,1200],[106,1200]],
  sub:true, tokenW:52, tokenH:66, fsBig:21, fsSmall:17,
};
/* スマホは上の余白を広めにとって、風景が見えるようにしてある */
const LAY_TALL = {
  vb:[560,2925], corner:112, skyH:108, artH:235,
  pts:[[92,200],[468,200],[468,440],[92,440],[92,680],[468,680],[468,920],[92,920],
       [92,1160],[468,1160],[468,1400],[92,1400],[92,1640],[468,1640],[468,1880],[92,1880],
       [92,2120],[468,2120],[468,2360],[92,2360],[92,2600],[468,2600],[468,2840],[92,2840]],
  sub:false, tokenW:46, tokenH:58, fsBig:21, fsSmall:18,
};
const layFor = wide => wide ? LAY_WIDE : LAY_TALL;
const HALFW = {choice:66, start:62, goal:62};
const halfW = t => HALFW[t] || 52;

let geo = null;   /* {lay, at(s), seg} — コマの位置計算でも使う */

/* 折れ線を、角だけ丸めた細かい点列に変える */
function densePath(lay){
  const P = lay.pts, Rr = lay.corner, out = [];
  const unit = (a,b)=>{ const d = [b[0]-a[0], b[1]-a[1]]; const n = Math.hypot(d[0],d[1]); return [d[0]/n, d[1]/n, n]; };
  let cur = P[0].slice();
  for(let i=1;i<P.length;i++){
    const v = P[i], [ux,uy,len] = unit(cur,v), hasCorner = i < P.length-1;
    const stop = hasCorner ? Math.max(0, len - Rr) : len;
    const n = Math.max(2, Math.round(stop/6));
    for(let k=0;k<=n;k++) out.push([cur[0] + ux*stop*k/n, cur[1] + uy*stop*k/n]);
    if(hasCorner){
      const [wx,wy] = unit(v, P[i+1]);
      const s = [cur[0] + ux*stop, cur[1] + uy*stop], e = [v[0] + wx*Rr, v[1] + wy*Rr], m = 40;
      for(let k=1;k<=m;k++){
        const t = k/m, it = 1-t;
        out.push([it*it*s[0] + 2*it*t*v[0] + t*t*e[0], it*it*s[1] + 2*it*t*v[1] + t*t*e[1]]);
      }
      cur = e;
    }
  }
  return out;
}
function buildGeo(lay){
  const D = densePath(lay), cum = [0];
  for(let i=1;i<D.length;i++) cum.push(cum[i-1] + Math.hypot(D[i][0]-D[i-1][0], D[i][1]-D[i-1][1]));
  const total = cum[cum.length-1];
  const at = s=>{
    let lo = 0, hi = cum.length-1;
    while(lo < hi-1){ const m = (lo+hi) >> 1; if(cum[m] < s) lo = m; else hi = m; }
    const t = (s - cum[lo]) / Math.max(1e-6, cum[hi] - cum[lo]);
    const p = [D[lo][0] + (D[hi][0]-D[lo][0])*t, D[lo][1] + (D[hi][1]-D[lo][1])*t];
    const a = D[Math.max(0,lo-2)], b = D[Math.min(D.length-1, hi+2)];
    const dx = b[0]-a[0], dy = b[1]-a[1], n = Math.hypot(dx,dy) || 1;
    return {p, n:[-dy/n, dx/n]};
  };
  return {lay, at, seg: total / SQUARES.length};
}

/* 背景：日本の風景を一枚に。せかい版は日本・欧米・ウガンダを並べていたが、

function drawScenery(svg, lay){

/* 高さ y のところで、その形の中にとれる「いちばん長い横の線」。無ければ null */
function widestSpan(poly, y){
  const xs = [];
  for(let k=0;k<poly.length;k++){
    const [x0,y0] = poly[k], [x1,y1] = poly[(k+1)%poly.length];
    if((y0 <= y && y1 > y) || (y1 <= y && y0 > y)) xs.push(x0 + (x1-x0)*(y-y0)/(y1-y0));
  }
  if(xs.length < 2) return null;
  xs.sort((a,b)=>a-b);
  let best = null;
  for(let k=0;k+1<xs.length;k+=2)
    if(!best || xs[k+1]-xs[k] > best[1]-best[0]) best = [xs[k], xs[k+1]];
  return best;
}
/* 横位置 x のところで、yRef をふくむ「ひとつづきの縦のひろがり」。無ければ null。
   Uターンのマスは同じ x で上の腕と下の腕をまたぐので、つながった区間だけを返す */
function vSpanAt(poly, x, yRef){
  const ys = [];
  for(let k=0;k<poly.length;k++){
    const [x0,y0] = poly[k], [x1,y1] = poly[(k+1)%poly.length];
    if((x0 <= x && x1 > x) || (x1 <= x && x0 > x)) ys.push(y0 + (y1-y0)*(x-x0)/(x1-x0));
  }
  if(ys.length < 2) return null;
  ys.sort((a,b)=>a-b);
  for(let k=0;k+1<ys.length;k+=2)
    if(yRef >= ys[k]-1 && yRef <= ys[k+1]+1) return [ys[k], ys[k+1]];
  return null;
}
/* マスの中で、文字のかたまりがいちばん広く入る場所をさがす。
   まっすぐなマスならまん中、Uターンのマスなら曲がりの外がわの太いところが選ばれる。
   offs は「かたまりの中心から見た、各行の位置」 */
function bestLabelSpot(poly, offs){
  const ys = poly.map(q=>q[1]);
  const top = Math.min(...ys), bot = Math.max(...ys), N = 30;
  const probes = [];
  offs.forEach(o=>{ probes.push(o-12, o+4); });
  const cand = [];
  for(let i=0;i<=N;i++){
    const ay = top + (bot-top)*i/N;
    let lo = -Infinity, hi = Infinity;
    for(const o of probes){
      const sp = widestSpan(poly, ay + o);
      if(!sp){ lo = 0; hi = -1; break; }
      lo = Math.max(lo, sp[0]); hi = Math.min(hi, sp[1]);
    }
    if(hi - lo > 0) cand.push({x:(lo+hi)/2, y:ay, w:hi-lo});
  }
  if(!cand.length) return null;
  const max = Math.max(...cand.map(c=>c.w));
  const tie = cand.filter(c=>c.w >= max-1);        /* 同じ広さなら、そのまん中に置く */
  return tie[Math.floor(tie.length/2)];
}
/* 横位置 x のところで、その形が上下どこからどこまであるか。無ければ null */
function spanAtX(poly, x){
  const ys = [];
  for(let k=0;k<poly.length;k++){
    const [x0,y0] = poly[k], [x1,y1] = poly[(k+1)%poly.length];
    if((x0 <= x && x1 > x) || (x1 <= x && x0 > x)) ys.push(y0 + (y1-y0)*(x-x0)/(x1-x0));
  }
  return ys.length ? [Math.min(...ys), Math.max(...ys)] : null;
}

/* アイコンの上下のひろがり（線の太さこみ）。種類ごとに高さがちがうので、
   文字のかたまりを上下まんなかに置くにはこれを見込む必要がある */
const ICON_Y = {
  income:[-12,12], cost:[-15,16], event:[-16,18], heavy:[-16,18], learn:[-10,11],
  choice:[-21,17], start:[-9,9], goal:[-12,16], fam:[-12,12],
};
/* マスのアイコン（盤面用・線で描く） */
function tileIcon(type, cx, cy, c){

  const a = (t,at)=>g.appendChild(el(t,at));

  } else if(type === "cost"){

  } else if(type === "learn"){
    a("path", {d:"M-13 -8 h11 a2 2 0 0 1 2 2 v15 a2 2 0 0 0 -2 -2 h-11 z", fill:"#fff", stroke:c, "stroke-width":2.8, "stroke-linejoin":"round"});
    a("path", {d:"M13 -8 h-11 a2 2 0 0 0 -2 2 v15 a2 2 0 0 1 2 -2 h11 z", fill:"#DCEEF9", stroke:c, "stroke-width":2.8, "stroke-linejoin":"round"});
  } else if(type === "choice"){

function renderBoard(){
  const lay = layFor(!mqMobile.matches);
  /* PCは盤面を1画面におさめるので、横幅の上限を盤面の縦横比から決める（CSSのvar） */
  document.documentElement.style.setProperty("--board-aspect", String(lay.aspect || 1.386));
  geo = buildGeo(lay);
  const svg = $("board");
  svg.setAttribute("viewBox", `0 0 ${lay.vb[0]} ${lay.vb[1]}`);
  svg.innerHTML = "";
  drawScenery(svg, lay);

  const gTiles = el("g", {}), gLabels = el("g", {});
  svg.appendChild(gTiles); svg.appendChild(gLabels);
  const {at, seg} = geo;
  const band = [];                                      /* 各マスの上下端。章ラベルの位置決めに使う */

  SQUARES.forEach((sq,i)=>{
    const m = TYPE_META[sq.t], hw = halfW(sq.t);
    /* STEPS：1マスの輪郭を何点で折るか。多いほど曲線がなめらかになる */
    const s0 = i*seg + 3.5, s1 = (i+1)*seg - 3.5, STEPS = 22, left = [], right = [], mid = [];
    for(let k=0;k<=STEPS;k++){
      const {p,n} = at(s0 + (s1-s0)*k/STEPS);
      left.push([p[0] + n[0]*hw, p[1] + n[1]*hw]);
      right.push([p[0] - n[0]*hw, p[1] - n[1]*hw]);
      mid.push(p);
    }
    const d = "M" + left.map(p=>p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ")
      + " L " + right.reverse().map(p=>p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + " Z";
    gTiles.appendChild(el("path", {d, id:`sq-${i}`, fill:m.fill, stroke:"#FFFFFF", "stroke-width":9, "stroke-linejoin":"round"}));

    const poly = left.concat(right);
    const big = sq.t === "choice" || sq.t === "start" || sq.t === "goal";
    const tTxt = sq.name || m.label;
    /* 年齢はトビラ・スタート・ゴールだけ。ほかのマスはPCでだけ年齢を小さく添える */
    const ageTxt = `${AGES[i]}歳`;
    let sTxt = big ? ageTxt : (lay.sub ? ageTxt : "");
    /* アイコン・見出し・説明の位置（かたまりの中心から見た相対位置）。
       アイコンの高さはマスの種類でちがうので、それを見込んで上下おなじ余白にそろえる */
    const iy = ICON_Y[sq.t] || [-12,12];
    const oIcon = -(big ? 30 : 26), oTitle = (big ? 12 : 10), oSub = (big ? 32 : 28);
    const blockTop = oIcon + iy[0], blockBot = sTxt ? oSub + 3 : oTitle + 4;
    const dy = -(blockTop + blockBot)/2;
    const offs = [oIcon + dy, oTitle + dy];
    if(sTxt) offs.push(oSub + dy);
    const spot = bestLabelSpot(poly, offs)
      || {x:mid[Math.floor(mid.length/2)][0], y:mid[Math.floor(mid.length/2)][1], w:2*hw};
    /* 上と下の余白をそろえる。いちばん広い場所は、曲がったマスだと上下どちらかに
       よることがあるので、その位置での「マスの縦のまん中」に置きなおす */
    const vSpan = vSpanAt(poly, spot.x, spot.y);
    if(vSpan) spot.y = (vSpan[0] + vSpan[1])/2;
    /* 1行ごとに、その高さで使える幅を測る。曲がったマスでも白いフチをまたがない。
       まとめて一番せまいところに合わせると、曲がりのマスだけ字が潰れてしまう */
    const roomAt = ys=>{
      let room = Infinity;
      for(const y of ys){
        const sp = widestSpan(poly, y);
        room = Math.min(room, sp ? 2*Math.min(spot.x - sp[0], sp[1] - spot.x) : 0);
      }
      return Math.max(46, room - 24);
    };
    const fit = (txt, base, ys)=>{
      const w = [...txt].reduce((s2,ch)=>s2 + (ch.charCodeAt(0) > 0x2E80 ? 1 : 0.55), 0);
      return Math.min(base, roomAt(ys)/Math.max(1,w));
    };
    gLabels.appendChild(tileIcon(sq.t, spot.x, spot.y + offs[0], m.chip));
    const yT = spot.y + offs[1];
    const title = el("text", {x:spot.x, y:yT, "text-anchor":"middle",
      "font-size":Math.max(10, fit(tTxt, big ? lay.fsBig : lay.fsSmall, [yT, yT-14])),
      "font-weight":900, fill:m.ink});
    title.textContent = tTxt;
    gLabels.appendChild(title);
    if(sTxt){
      const yS = spot.y + offs[2], probes = [yS, yS-9];
      const fs = fit(sTxt, big ? 12 : 11, probes);
      if(fs >= 9.8){
        const sub = el("text", {x:spot.x, y:yS, "text-anchor":"middle",
          "font-size":fs, "font-weight":700,
          fill:big ? m.ink : "#6E7E8C", opacity:big ? .92 : 1});
        sub.textContent = sTxt;
        gLabels.appendChild(sub);
      }
    }
    band[i] = poly;      /* 章のラベルを置くときに、どこが空いているかを測るのに使う */
  });

  /* 章のラベルは、段と段のあいだの「ほんとうに空いているところ」のまん中に置く。
     角のタイルはとなりの段までふくらむので、盤面のまん中(cx)での空きだけを見る */
  const cx = lay.vb[0]/2, perRow = lay.sub ? 6 : 3;
  const spans = band.map(poly=>spanAtX(poly, cx));
  CHAPTERS.forEach((ch,r)=>{
    const first = r*6;
    const tops = spans.slice(first, first + perRow).filter(Boolean).map(v=>v[0] - 4.5);
    const bots = spans.slice(0, first).filter(Boolean).map(v=>v[1] + 4.5);
    const top = tops.length ? Math.min(...tops) : 40;
    const y = bots.length
      ? (Math.max(...bots) + top)/2
      : Math.max(16, top - 30);                         /* 1章目だけは、段の上に同じだけ空けて置く */
    /* 章の注記は横にゆとりのあるPCだけ。スマホは章の名前だけにする */
    const t = ch.t + (lay.sub && ch.note ? ` ── ${ch.note}` : "");
    const w = Math.min(lay.vb[0] - 24, t.length*(lay.sub ? 14 : 15) + 24);
    gLabels.appendChild(el("rect", {x:cx - w/2, y:y - 13, width:w, height:26, rx:13,
      fill:"#fff", opacity:.95, stroke:"#DCE7EE", "stroke-width":2}));
    const e = el("text", {x:cx, y:y + 5, "font-size":lay.sub ? 13.5 : 13, "font-weight":900,
      fill:"#3F5266", "text-anchor":"middle"});
    e.textContent = t;
    gLabels.appendChild(e);
  });

  svg.appendChild(el("g", {id:"tokLayer"}));
}

/* コマの表情。数字の変化ではなく「いまの状態」をあらわす。
   せかい版の「退出中＝angry」は1画面版にないので、被災のあいだを angry にしている */
function emotionOf(p, isTurn){
  if(p.disasterTurns > 0) return "angry";
  if(p.money < 0) return "sad";
  if(p.done) return "joy";
  return isTurn ? "fun" : "joy";
}
function renderTokens(){
  const layer = $("tokLayer");
  if(!layer || !players.length || !geo) return;
  layer.innerHTML = "";
  const {at, seg, lay} = geo;
  /* 同じマスに重なったときは、少しずつ横にずらす */
  const bucket = {};
  players.forEach((p,idx)=>{ (bucket[p.pos] = bucket[p.pos] || []).push({p, idx}); });
  Object.entries(bucket).forEach(([posStr,list])=>{
    const pos = +posStr;
    const sq = SQUARES[pos]; if(!sq) return;
    const {p:c, n} = at(pos*seg + seg/2);
    const hw = halfW(sq.t);
    /* どの段でも「タイルの上ふち」に立つよう、法線の向きをそろえる */
    const sg = n[1] < 0 ? 1 : -1;
    const base = [c[0] + n[0]*sg*(hw - 6), c[1] + n[1]*sg*(hw - 6)];
    const W = lay.tokenW, H = lay.tokenH;
    list.forEach(({p,idx},k)=>{
      const off = (k - (list.length-1)/2)*(W*0.52);
      const foot = [base[0] + off, base[1] - Math.abs(off)*0.12];
      const g = el("g", {id:`tok-${idx}`});
      g.appendChild(el("ellipse", {cx:foot[0], cy:foot[1]-1, rx:15, ry:5, fill:"rgba(63,82,102,.18)"}));
      const isTurn = idx === turn && !p.done;
      if(isTurn){
        g.appendChild(el("rect", {x:foot[0]-34, y:foot[1]-H-23, width:68, height:22, rx:11, fill:p.color}));
        const t = el("text", {x:foot[0], y:foot[1]-H-8, "text-anchor":"middle",
          "font-size":12.5, "font-weight":900, fill:"#fff"});
        t.textContent = p.name;
        g.appendChild(t);
      }
      /* キャラは SVG の <image> で描く。HTMLを埋めこむ foreignObject だと
         描き直しのタイミングが影や名前とそろわず、歩いている最中にずれて見える */
      const img = el("image", {
        href:`./chars/${charOf(p)}-${emotionOf(p, isTurn)}.png`,
        x:foot[0] - W/2, y:foot[1] - H, width:W, height:H,
        preserveAspectRatio:"xMidYMax meet",
        opacity:isTurn ? 1 : .82,
      });
      img.style.filter = "drop-shadow(0 1px 2px rgba(63,82,102,.3))";
      g.appendChild(img);
      layer.appendChild(g);
    });
  });
}
/* 手番プレイヤーのマスが見えるように画面を追従させる */
function focusSquare(pos){
  const t = $(`sq-${pos}`);
  if(!t || !t.getBoundingClientRect) return;
  const r = t.getBoundingClientRect();
  if(r.height === 0) return;
  window.scrollTo({top:Math.max(0, r.top + window.scrollY - (window.innerHeight - r.height)/2), behavior:"smooth"});
}

/* ===================== サイコロ ===================== */
const PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
let spinTimer = null;
function diceFace(n, box){
  const on = new Set(PIPS[n] || []);
  (box || $("diceFace")).innerHTML = Array.from({length:9}, (_,i)=> on.has(i) ? "<span><i></i></span>" : "<span></span>").join("");
}
/* 画面中央の大きなサイコロ。立体の6面を組んで、本体ごと転がす。
   ひととおり転がしてから、出た目の面が正面を向くように着地させる */
let diceBusy = false, rollStart = 0;
const MIN_ROLL = 900, HOLD = 820;                /* 着地の回りこみ(.6s)を見せてから閉じる */
/* その目の面が正面を向くように、本体を回す向き。CSSの .f1〜.f6 の置き方と対になっている */
const FACE_ROT = {
  1:"rotateX(0deg) rotateY(0deg)", 2:"rotateX(0deg) rotateY(-90deg)",
  3:"rotateX(-90deg) rotateY(0deg)", 4:"rotateX(90deg) rotateY(0deg)",
  5:"rotateX(0deg) rotateY(90deg)", 6:"rotateX(0deg) rotateY(180deg)",
};
/* 6面ぶんの目を一度だけ組み立てる */
function buildBigDie(die){
  if(die.childElementCount) return;
  for(let n=1;n<=6;n++){
    const face = document.createElement("div");
    face.className = "face f" + n;
    diceFace(n, face);
    die.appendChild(face);
  }
}
function startBigDice(){
  if(diceBusy) return;
  diceBusy = true; rollStart = Date.now();
  const stage = $("diceStage"), scene = $("dieScene"), die = $("bigDie");
  buildBigDie(die);
  stage.classList.add("on");
  scene.classList.remove("land");
  die.classList.remove("land"); die.style.transform = ""; die.classList.add("roll");
  $("dieMsg").textContent = "";                 /* 回っているあいだは文字を出さない。前回の「N マスすすむ！」も消す */
  se("roll");
  spinTimer = setInterval(()=>diceFace(1 + Math.floor(Math.random()*6)), 80);
}
function landBigDice(n, done){
  if(!diceBusy || !spinTimer) return;
  const delay = Math.max(0, MIN_ROLL - (Date.now() - rollStart));
  setTimeout(()=>{
    if(!spinTimer) return;
    clearInterval(spinTimer); spinTimer = null;
    const die = $("bigDie");
    /* 回っている途中の向きをいったん固定してから着地の向きへ動かす。
       そうしないと、アニメを外した瞬間に正面向きへ飛んでしまう */
    const mid = getComputedStyle(die).transform;
    die.classList.remove("roll");
    die.style.transition = "none";
    die.style.transform = mid;
    void die.offsetWidth;                         /* ここで一度レイアウトさせる */
    die.style.transition = "";
    die.classList.add("land");
    die.style.transform = FACE_ROT[n] || FACE_ROT[1];
    $("dieScene").classList.add("land");
    diceFace(n);
    se("land");
    $("dieMsg").textContent = `${n} マスすすむ！`;
    setTimeout(()=>{
      $("diceStage").classList.remove("on");
      diceBusy = false;
      if(done) done();                            /* ここからコマが歩きだす */
    }, HOLD);
  }, delay);
}
/* 出目の決め方（乱数）はそのまま。見せ方だけ立体のサイコロにした */
function spinDice(){
  return new Promise(res=>{
    startBigDice();
    const n = 1 + Math.floor(Math.random()*6);
    landBigDice(n, ()=>res(n));
  });
}

/* ===================== turn flow ===================== */
function beginTurn(){
  updateTurnUI();
  focusSquare(players[turn].pos);
  const p = players[turn];
  if(p.letterIn !== null){
    p.letterIn--;
    if(p.letterIn <= 0){
      p.letterIn = null;
      busy = true; $("diceBtn").disabled = true;
      showLetterModal(turn);
      return;
    }
  }
  busy = false;
  $("diceBtn").disabled = false;
  /* 高校時代(進路の手前まで)はサイコロを使わず1マスずつ */
  const hs = p.pos < 4;
  $("diceFace").style.display = hs ? "none" : "grid";
  $("diceLabel").textContent = hs ? "一歩すすむ" : "サイコロを回す";
}

$("diceBtn").onclick = async ()=>{
  if(busy) return;
  busy = true;
  $("diceBtn").disabled = true;
  if(players[turn].pos < 4){
    /* 子ども時代は1マスずつなので、サイコロの音ではなく足音にする */
    se("step");
    await movePlayer(turn, 1);
  } else {
    const n = await spinDice();
    await movePlayer(turn, n);
  }
};

async function movePlayer(idx, steps){
  const p = players[idx];
  let target = Math.min(p.pos + steps, SQUARES.length-1);
  for(let i=p.pos+1; i<target; i++){
    if(SQUARES[i].stop){ target = i; break; }
  }
  while(p.pos < target){
    p.pos++;
    se("step");
    renderTokens();
    focusSquare(p.pos);
    await wait(210);
  }
  await wait(150);
  resolveSquare(idx);
}

/* ===================== square resolution ===================== */
/* ★まなびの数（＝お給料）に応じたいまの仕事 */
function jobTitle(p){
  const L = p.learn;
  if(L <= 1) return {ic:"🍔", t:"アルバイトかけもち"};
  if(L <= 2) return {ic:"🔧", t:"工場・現場のスタッフ"};
  if(L <= 3) return {ic:"🗂", t:"会社の一般事務"};
  if(L <= 4) return {ic:"🤝", t:"営業・販売のリーダー"};
  if(L <= 5) return {ic:"💻", t:"専門職・エンジニア"};
  if(L <= 6) return {ic:"🏢", t:"大手企業の社員"};
  return {ic:"👑", t:"マネージャー・専門家"};
}
function resolveSquare(idx){
  const p = players[idx];
  const sq = SQUARES[p.pos];
  if(sq.t === "income"){
    let amt, note, title = sq.name || "おしごと";
    if(sq.fixed != null){
      amt = sq.fixed;
      note = "はじめてのお給料！";
    } else {
      amt = 20 + p.learn*10 + p.allow;
      const job = jobTitle(p);
      title = `${job.ic} ${AGES[p.pos]}歳・いまの仕事：${job.t}`;
      note = `お給料は <b>20万 ＋ まなび×10万${p.allow>0 ? " ＋ 仕送り"+p.allow+"万" : ""}</b><br>まなびが増えると、仕事もお給料も変わっていく`;
      if(p.disasterTurns > 0){ amt -= 10; note += `<br>${ic("bolt","s")} 被災の影響で −10万（あと${p.disasterTurns}ターン）`; }
      if(p.loan > 0){
        const pay = Math.min(6, p.loan);
        p.loan -= pay; amt -= pay;
        note += `<br>${ic("cap","s")} 奨学金の返済 −${pay}万（のこり${p.loan}万）`;
      }
    }
    showInfoModal("income", title, note, {money:amt}, idx);
  }
  else if(sq.t === "cost"){
    showInfoModal("cost", sq.name, "生きているとお金はかかる。固定費、だいじ。", {money:-sq.amt}, idx);
  }
  else if(sq.t === "event"){
    if(heavyOn && !p.hadHeavy && p.pos >= 8 && Math.random() < 0.3){
      triggerHeavy(idx); return;
    }
    drawEvent(idx);
  }
  else if(sq.t === "learn"){
    showChoiceModal(idx, choiceDef("learnSq", p), "learn");
  }
  else if(sq.t === "choice"){
    showChoiceModal(idx, choiceDef(sq.key, p), "choice");
  }
  else if(sq.t === "goal"){
    p.done = true;
    p.rankAt = players.filter(x=>x.done).length;
    showGoalModal(idx);
  }
  else endTurn();
}

/* ---------- できごと ---------- */
function drawEvent(idx){
  const p = players[idx];
  let ev = null, guard = 0;
  while(guard++ < 30){
    if(deck.length === 0) deck = shuffle([...EVENTS]);
    const cand = deck.pop();
    if((cand.kind === "info" || cand.kind === "fair") && p.hidden.size === 0) continue;
    ev = cand; break;
  }
  if(!ev){ endTurn(); return; }

  if(ev.kind === "info"){
    const n = p.perk === "tsunagari" ? 2 : 1;
    const revealed = revealTags(p, ev.reveal, n);
    showInfoModal("event", ev.t, ev.d, {}, idx,
      revealed > 0 ? `${ic("eye","s")} 見えていなかった選択肢が <b>${revealed}個</b>、見えるようになった！` : null);
  }
  else if(ev.kind === "fair"){
    showChoiceModal(idx, {
      title:"進学フェアが、となりの県まで来た",
      body:"交通費はかかるけど、行けば情報が手に入る。",
      opts:[
        {t:"電車を乗りついで行ってみる", d:"パンフレットと、話を聞ける大人がそこにいる", req:{money:5}, fx:{money:-5}, special:"reveal2"},
        {t:"今回は見送る", d:"交通費も、ばかにならないから", req:{}, fx:{}},
      ]
    }, "event");
  }
  else {
    const fx = {...ev.fx};
    if(p.perk === "akinai" && fx.money > 0) fx.money += 10;
    showInfoModal("event", ev.t, ev.d, fx, idx);
  }
}
/* target: "any"=優先順で / "seido"=制度を優先 */
function revealTags(p, target, n){
  const order = ["seido","career","global"];
  let count = 0;
  if(target === "seido" && p.hidden.has("seido")){ p.hidden.delete("seido"); count++; n--; }
  for(const t of order){
    if(n <= 0) break;
    if(p.hidden.has(t)){ p.hidden.delete(t); count++; n--; }
  }
  return count;
}

/* ステータスがどう変わったかを、前後の数字で見せる */
function chgPanel(before, fx){
  const rows = [
    ["money","おかね", before.money, fx.money||0, v=>fm(v)],

  return `<div class="chg-body">
    <div class="chg-char" style="background-image:url(./chars/${charOf(before)}-${emo}.png)"></div>
    <div class="chg-rows">${rows.map(([k,label,base,d,f])=>`
      <div class="chg-r ${k}"><span class="k">${label}</span>
        <span class="v"><s>${f(base)}</s>${f(base+d)}</span>
        <span class="d ${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : ""}${k === "money" ? fm(d) : d}</span></div>`).join("")}
    </div></div>`;
}
function applyFx(p, fx){
  p.money += fx.money||0;
  p.learn += fx.learn||0;
  p.happy += fx.happy||0;
}
/* 出てきた画面にあわせて鳴らす音を選ぶ。数字が増えるか減るかで、うれしい／つらいを分ける */
function fxSound(fx, type){
  if((fx.money||0) < 0 || (fx.happy||0) < 0) return "bad";
  if((fx.money||0) > 0 || (fx.learn||0) > 0 || (fx.happy||0) > 0) return "good";
  return type === "heavy" ? "bad" : "pop";
}

function showInfoModal(type, title, body, fx, idx, note){
  const p = players[idx];

  openModal(`<div class="m-head">${tagChip(type)}<h2>${title}</h2></div>
    <div class="m-body">
      <p class="m-lead">${body}</p>
      ${note ? `<div class="m-note">${note}</div>` : ""}
      ${chgPanel(p, fx)}
      <button class="m-btn" id="mOk">OK</button>
    </div>`);
  $("mOk").onclick = ()=>{
    applyFx(p, fx);
    closeModal(); endTurn();
  };
}

function effectiveMoneyReq(p, o){
  let m = o.req.money || 0;
  if(p.seidoDiscount && (o.tag === "seido" || o.tag === "manabi")) m = Math.max(0, m - 50);
  return m;
}
/* 制度サポートは、カギ（必要額）だけでなく、はらうお金も最大50万ぶん軽くする */
function effectiveMoneyFx(p, o){
  const m = o.fx.money || 0;
  if(m < 0 && p.seidoDiscount && (o.tag === "seido" || o.tag === "manabi")) return Math.min(0, m + 50);
  return m;
}
function reqLabel(p, o){
  const parts = [];
  const em = effectiveMoneyReq(p, o);
  if(o.req.money) parts.push(money(em) + (em < o.req.money ? "（制度サポートで−50万）" : ""));
  if(o.req.learn) parts.push(learn(o.req.learn));
  if(o.req.maxMoney != null) parts.push(`所得制限 ${money(o.req.maxMoney)}未満`);
  return parts.join(" ＋ ");
}
function meetsReq(p, o){
  const em = effectiveMoneyReq(p, o);
  if(em > 0 && em > p.money) return false;  // カギなし(0円)の選択肢は借金中でも選べる
  if(o.req.learn && p.learn < o.req.learn) return false;
  if(o.req.maxMoney != null && p.money >= o.req.maxMoney) return false;  // 所得制限
  return true;
}
/* 一覧に置くトビラの目じるし。奥のわくと手前の扉をかさねて、扉だけがひらくようにする */
const doorMark = ()=>`<span class="d-mark">
      <svg class="ic way" aria-hidden="true"><use href="#ic-doorway"/></svg>
      <svg class="ic leaf" aria-hidden="true"><use href="#ic-door-leaf"/></svg></span>`;

function showChoiceModal(idx, def, type, skipCount){
  const p = players[idx];
  const isHeavy = type === "heavy" || !!def.heavy;
  const chipType = isHeavy ? "heavy" : (type === "learn" ? "learn" : (type === "event" ? "event" : "choice"));
  const states = def.opts.map(o=>{
    if(o.tag && p.hidden.has(o.tag)) return "unseen";
    return meetsReq(p, o) ? "open" : "locked";
  });
  const logEntry = {title:def.title, variant:def.variant, age:AGES[p.pos], opts:def.opts, states, chosen:null};
  if(!skipCount){
    states.forEach(s=>{
      if(s === "unseen") p.unseen++;
      else if(s === "open") p.open++;
      else p.locked++;
    });
    p.doorLog.push(logEntry);
  }
  /* 表示順はシャッフルする（いつも一番上＝高額、で無思考に選ばれるのを防ぐ）。
     data-i は元の並びのままなので、記録や一覧の集計はずれない */
  const order = shuffle(def.opts.map((_,i)=>i));
  const stuck = !states.includes("open");
  /* 死別・被災などのライフイベントは「トビラ」ではないので、言い方も目じるしも変える */
  const isDoor = !isHeavy;
  const W = isDoor ? {
    ask:"このトビラを開けますか？", yes:"はい、このトビラを開ける",
    backAgain:"やっぱり、ほかのトビラを見る", back:"ほかのトビラを見る",
    ng:"……このトビラは開かなかった。", pass:"どれも開かない。今回は見送る",
  } : {
    ask:"これをえらびますか？", yes:"はい、これにする",
    backAgain:"やっぱり、ほかの選択肢を見る", back:"ほかの選択肢を見る",
    ng:"……これは選べなかった。", pass:"どれも選べない。今回は見送る",
  };
  se(isDoor ? "door" : "bad");

  const head = `<div class="m-head">${tagChip(chipType)}<h2>${def.title}</h2></div>`;

  /* --- 一覧：どれも同じ見た目。開くかどうかは押すまで分からない --- */
  /* まず「どんなトビラの前にいるか」を読んでから、自分の手もと（ステータス）を見てもらう */
  const listHtml = ()=>`<div class="m-body">
      <p class="m-lead">${def.body}</p>
      <div class="pcard now m-pcard" style="--ring:${p.color}">${playerCardBody(p)}</div>
      <div class="door-list">${order.map(i=>{
        if(states[i] === "unseen") return `<button class="door unseen" disabled>
            ${isDoor ? `<span class="d-mark unseen">${ic("eye")}</span>` : ""}
            <span class="d-main"><span class="d-title">？？？</span>
              <span class="d-desc">この選択肢は、見えない。</span></span></button>`;
        /* 中身（どう伸びるか・なにを失うか）は押したあとの確認画面で見せる。
           ここでは名前だけを見て、開けにいくかどうかを決める。
           「押せる」ことは文字で説明せず、目じるしのトビラがひらいて答える */
        return `<button class="door pick" data-i="${i}" data-se="off">
            ${isDoor ? doorMark() : ""}
            <span class="d-main"><span class="d-title">${def.opts[i].t}</span></span></button>`;
      }).join("")}</div>
    </div>`;

  /* --- 押したあと：カギと金額を開いて、最後にもう一度たずねる --- */
  const confirmHtml = i=>{
    const o = def.opts[i], ok = states[i] === "open";
    const key = reqLabel(p, o);
    /* お金の増減だけは選ぶ前に見せる（★とハートは選ぶまでのお楽しみ）
       カギの金額と支払い額が同じときはカギ表示だけにする（冗長回避） */
    const em = effectiveMoneyReq(p, o);
    const raw = o.fx.money || 0;
    const efx = effectiveMoneyFx(p, o);
    const cut = efx !== raw;                        // 制度サポートで安くなった
    const redundant = o.req.money && efx === -em;   // カギ表示と同じ額なら出さない
    const loan = o.special === "shogakukin" && !(p.seidoDiscount || p.perk === "seidoPro");
    const cost = ((efx || cut) && !redundant)
      ? `<div class="d-cost ${efx<0 ? "minus" : "plus"}">${ic("coin","s")} おかね ${cut ? `<s>${fm(raw)}</s>→` : ""}${efx>0 ? "+" : ""}${fm(efx)}${loan ? "＋これから返済" : ""}</div>`
      : "";
    /* 何が足りないのかを取りちがえないように、理由ごとに書きわける */
    const short = (o.req.maxMoney != null && p.money >= o.req.maxMoney)
      ? "所得制限で、いまのあなたは対象外だった" : "カギが足りない";
    return `<div class="m-body">
      <div class="c-card ${ok ? "ok" : "ng"}">
        ${isDoor ? `<span class="d-badge ${ok ? "open" : "lock"}">${ic(ok ? "door" : "lock","s")}${ok ? "開けられるトビラ" : "カギが足りないトビラ"}</span>` : ""}
        <div class="c-title">${o.t}</div>
        <div class="d-desc">${o.d}</div>
        ${key ? `<div class="c-key">カギ：${key}
          <span class="c-now">いまのあなた：${money(p.money)}／${learn(p.learn)}</span></div>` : ""}
        ${cost}
      </div>
      ${ok
        ? `<p class="c-ask">${W.ask}</p>
           <button class="m-btn" id="mYes" data-se="${isDoor ? "open" : "tap"}">${W.yes}</button>
           <button class="m-btn ghost" id="mBack">${W.backAgain}</button>`
        : `<p class="c-ask ng">${ic("lock","s")} ${short}${W.ng}</p>
           <button class="m-btn" id="mBack">${W.back}</button>
           ${stuck ? `<button class="m-btn ghost" id="mPass">${W.pass}</button>` : ""}`}
    </div>`;
  };

  const bind = ()=>{
    document.querySelectorAll("#modalBox .door.pick").forEach(b=>{
      b.onclick = ()=>{
        se(states[+b.dataset.i] === "open" ? "unlock" : "locked");
        paint(confirmHtml(+b.dataset.i), +b.dataset.i);
      };
    });
    if($("mBack")) $("mBack").onclick = ()=>paint(listHtml());
    if($("mPass")) $("mPass").onclick = ()=>{ closeModal(); endTurn(); };
  };
  const paint = (body, pickI)=>{
    $("modalBox").innerHTML = head + body;
    $("modalBox").scrollTop = 0;
    bind();
    if(pickI != null && $("mYes")) $("mYes").onclick = ()=>choose(pickI);
  };

  function choose(i){
    logEntry.chosen = i;
    const o = def.opts[i];
    const fx = {...o.fx};
    const notes = [];
    /* 制度サポートは、はらうお金にも効く */
    if(fx.money){
      fx.money = effectiveMoneyFx(p, o);
      if(fx.money !== o.fx.money && o.special !== "shogakukin"){
        notes.push(`${ic("spark","s")} 制度サポートで、はらうお金が <b>${o.fx.money}万 → ${fx.money}万</b> に軽くなった。`);
      }
    }
    if(o.special === "revealAll" && p.hidden.size > 0){
      p.hidden.clear();
      notes.push(`${ic("eye","s")} いままで見えていなかった選択肢が、ぜんぶ見えるようになった！`);
    }
    if(o.special === "reveal2"){
      const n = revealTags(p, "any", p.perk === "tsunagari" ? 4 : 2);
      if(n > 0) notes.push(`${ic("eye","s")} 見えていなかった選択肢が <b>${n}個</b>、見えるようになった！`);
    }
    if(o.special === "seidoSupport"){
      p.seidoDiscount = true;
      p.hidden.delete("seido");
      notes.push(`${ic("spark","s")} これから先、制度・まなび系のトビラが <b>最大50万ぶん安くなる</b>。カギ（必要なお金）も、じっさいにはらうお金も。`);
    }
    if(o.special === "letter"){
      p.letterIn = 2;
    }
    if(o.special === "shogakukin"){
      if(p.seidoDiscount || p.perk === "seidoPro"){
        notes.push(`${ic("spark","s")} 制度を知っていたおかげで<b>給付型奨学金</b>に出会えた！学費の負担も軽くなり、返済もいらない。`);
      } else {
        p.loan = 48;
        notes.push(`${ic("cap","s")} これは<b>貸与型</b>（総額48万）。働きはじめたら、お給料から<b>すこしずつ（−6万）</b>、45歳まで返していく。`);
      }
    }
    if(o.tag === "seido" && p.perk === "seidoPro" && !p.seidoUsed){
      p.seidoUsed = true;
      fx.learn = (fx.learn||0) + 1;
      notes.push(`${ic("spark","s")} 制度を知っている強みで まなび+1`);
    }
    openModal(`<div class="m-head">${tagChip(chipType, "えらんだ！")}<h2>${o.t}</h2></div>
      <div class="m-body">
        <p class="m-lead">${o.d}。</p>
        ${notes.length ? `<div class="m-note">${notes.join("<br>")}</div>` : ""}
        ${chgPanel(p, fx)}
        <button class="m-btn" id="mOk">OK</button>
      </div>`);
    $("mOk").onclick = ()=>{ applyFx(p, fx); closeModal(); endTurn(); };
  }

  openModal(head + listHtml());
  bind();
}

/* ---------- end of turn ---------- */
function endTurn(){
  const cur = players[turn];
  if(cur.disasterTurns > 0) cur.disasterTurns--;
  renderStrip(); renderTokens();
  if(players.every(x=>x.done)){ showResult(); return; }
  do { turn = (turn+1) % players.length; } while(players[turn].done);
  beginTurn();
}

          <div class="r-fam" style="color:${tone[1]}">${ic("home","s")} ${p.fam.name}</div>
        </div>

      <div class="r-story">${p.fam.story}</div>
      <div class="r-stats">
        <div class="rs happy"><div class="k">${ic("heart")}ハッピー</div>
          <div class="v"><s>0</s>${p.happy}</div>
          <div class="d ${p.happy>0 ? "up" : ""}">${p.happy>0 ? "+"+p.happy : "変わらず"}</div></div>
        <div class="rs money"><div class="k">${ic("coin")}おかね</div>
          <div class="v"><s>${fm(p.initMoney)}</s>${fm(p.money)}</div>
          <div class="d ${diff>0 ? "up" : (diff<0 ? "dn" : "")}">${diff>0 ? "+" : ""}${diff===0 ? "変わらず" : fm(diff)}</div></div>
        <div class="rs learn"><div class="k">${ic("star")}まなび</div>
          <div class="v"><s>★${p.initLearn}</s>★${p.learn}</div>
          <div class="d ${dLearn>0 ? "up" : ""}">${dLearn>0 ? "+"+dLearn : "変わらず"}</div></div>
      </div>
      <div class="r-ending"><b>🌅 45歳のいま</b>：${endingText(p)}</div>
      <div class="doorbar">
        <div class="seg-open" style="width:${pct(p.open)}%"></div>
        <div class="seg-lock" style="width:${pct(p.locked)}%"></div>
        <div class="seg-unseen" style="width:${pct(p.unseen)}%"></div>
      </div>
      <div class="doorbar-label">出会ったトビラ ${total}枚 ── <span class="lo">開けられた ${p.open}</span>／<span class="ll">カギが足りなかった ${p.locked}</span>／<span class="lu">見えていなかった ${p.unseen}</span></div>
      <button class="chip-btn rv-btn" data-p="${players.indexOf(p)}">${ic("door","s")} トビラのネタバラシを見る</button>`;
    list.appendChild(card);
  });
  list.querySelectorAll(".rv-btn").forEach(b=>{
    b.onclick = ()=>showRevealModal(+b.dataset.p);
  });

  const totalUnseen = players.reduce((s,p)=>s+p.unseen, 0);
  $("insightBox").innerHTML = `

    順位を決めたのは、お金の多さじゃなくて <b>♥ハッピー</b>。<br>
    ♥が多いということは——<b>人生の選択肢をたくさん持ち、じぶんの意思で選べた</b>ということ。<br>
    そして「選べる」ためには、<b>おかね</b>や<b>まなび</b>というカギが必要だった。<br><br>
    でも今日いちばん大事なのは、たぶんこっち——<br>
    このテーブル全体で、<b>${totalUnseen}枚のトビラが「見えてすら いなかった」</b>ということ。<br>
    カギが足りないのと、扉があることを知らないのは、ぜんぜん違う。<br><br>
    ${ic("door","s")} それぞれのカードの<b>「ネタバラシ」ボタン</b>で、？？？の中身をのぞいてみよう。<br><br>

    ・開けたかったのに、届かなかった／見えていなかったトビラはあった？<br>
    ・家庭カードを見せ合おう。同じマスで、見えていた景色はどう違った？<br>
    ・現実の世界で「カギ」になるものは、お金のほかに何があるだろう？`;
}

/* ===================== reveal（ネタバラシ） ===================== */
function rawReqLabel(o){
  const parts = [];
  if(o.req.money) parts.push(`おかね${fm(o.req.money)}`);
  if(o.req.learn) parts.push(`★${o.req.learn}`);
  if(o.req.maxMoney != null) parts.push(`所得制限おかね${fm(o.req.maxMoney)}未満`);
  return parts.join("＋");
}
function fxInline(fx){
  const parts = [];
  if(fx.money) parts.push(`${fx.money>0 ? "+" : ""}${fm(fx.money)}`);
  if(fx.learn) parts.push(`★+${fx.learn}`);
  if(fx.happy) parts.push(`♥+${fx.happy}`);
  return parts.join(" ");
}
const RV_META = {
  chosen:["check","えらんだ","#4CA872"], open:["door","開けられた","#4CA872"],
  locked:["lock","カギ不足","#C98A3C"], unseen:["eye","見えてなかった！","#7E6BC4"],
};
function showRevealModal(pIdx){
  const p = players[pIdx];
  const secs = p.doorLog.map(e=>{
    const rows = e.opts.map((o,i)=>{
      const st = e.chosen === i ? "chosen" : e.states[i];
      const [icon, label, col] = RV_META[st];
      const key = rawReqLabel(o);
      const fx = fxInline(o.fx);
      return `<div class="rv-opt ${st}"><span class="rv-ic" style="color:${col}">${ic(icon)}</span>
        <span class="rv-main"><span class="rv-t">${o.t}</span><span class="rv-d">${o.d}</span>
        <span class="rv-meta">${key || "カギなし"}${fx ? `　→ ${fx}` : ""}</span></span>
        <span class="rv-st">${label}</span></div>`;
    }).join("");
    return `<div class="rv-door"><div class="rv-title">${e.age != null ? e.age+"歳 ── " : ""}${e.title}${e.variant ? `（${e.variant}の家庭）` : ""}</div>${rows}</div>`;
  }).join("");
  openModal(`<div class="rule-page">
      ${tagChip("choice","ネタバラシ")}
      <h2>${p.name} さんが出会ったトビラ、ぜんぶ</h2>
      <p class="m-lead" style="text-align:left">紫は、ゲーム中「？？？」で中身が見えなかったトビラ。<br>ほんとうは、こんな選択肢だった——</p>
      <div class="rv-list">${secs || "<p class='m-lead'>トビラには出会わなかったみたい。</p>"}</div>
      <button class="m-btn" id="rvOk">とじる</button></div>`, closeModal);
  $("rvOk").onclick = closeModal;
}

/* 全員分・年齢順のトビラ一覧 */
const whoChips = list => list.map(p=>`<span class="who"><span class="p-dot" style="background:${p.color}"></span>${p.name}</span>`).join("");
function showAllDoorsModal(){
  const map = new Map();
  players.forEach(p=>{
    p.doorLog.forEach(e=>{
      const key = `${e.age}|${e.title}|${e.variant || ""}`;
      if(!map.has(key)) map.set(key, {age:e.age, title:e.title, variant:e.variant, opts:e.opts,
        perOpt:e.opts.map(()=>({chosen:[], locked:[], unseen:[]}))});
      const g = map.get(key);
      e.opts.forEach((o,i)=>{
        if(e.chosen === i) g.perOpt[i].chosen.push(p);
        else if(e.states[i] === "unseen") g.perOpt[i].unseen.push(p);
        else if(e.states[i] === "locked") g.perOpt[i].locked.push(p);
      });
    });
  });
  /* だれも通らなかったトビラマスも一覧に載せる（まちのトビラは都心・地方の両方） */
  SQUARES.forEach((sq,i)=>{
    if(sq.t !== "choice") return;
    const regions = sq.key === "machi" ? ["地方","都心"] : ["地方"];
    regions.forEach(rg=>{
      const dummy = {region:rg, perk:null, money:0, learn:0, seidoDiscount:false, name:""};
      const def = choiceDef(sq.key, dummy);
      const key = `${AGES[i]}|${def.title}|${def.variant || ""}`;
      if(!map.has(key)) map.set(key, {age:AGES[i], title:def.title, variant:def.variant, opts:def.opts,
        perOpt:def.opts.map(()=>({chosen:[], locked:[], unseen:[]})), untrodden:true});
    });
  });
  const groups = [...map.values()].sort((a,b)=>a.age-b.age);
  const secs = groups.map(g=>{
    const rows = g.opts.map((o,i)=>{
      const st = g.perOpt[i];
      const key = rawReqLabel(o);
      const fx = fxInline(o.fx);
      const lines = [];
      if(st.chosen.length) lines.push(`<div class="rv-who" style="color:#4CA872">${ic("check","s")} えらんだ：${whoChips(st.chosen)}</div>`);
      if(st.locked.length) lines.push(`<div class="rv-who" style="color:#C98A3C">${ic("lock","s")} カギ不足：${whoChips(st.locked)}</div>`);
      if(st.unseen.length) lines.push(`<div class="rv-who" style="color:#7E6BC4">${ic("eye","s")} 見えなかった：${whoChips(st.unseen)}</div>`);
      return `<div class="rv-opt ${st.unseen.length ? "unseen" : ""}"><span class="rv-main">
        <span class="rv-t">${o.t}</span><span class="rv-d">${o.d}</span>
        <span class="rv-meta">${key || "カギなし"}${fx ? `　→ ${fx}` : ""}</span>${lines.join("")}</span></div>`;
    }).join("");
    return `<div class="rv-door"${g.untrodden ? ' style="opacity:.75"' : ""}>
      <div class="rv-title">${g.age}歳 ── ${g.title}${g.variant ? `（${g.variant}の家庭）` : ""}${g.untrodden ? `<span class="rv-untrod">${ic("walk","s")} だれも通らなかった</span>` : ""}</div>${rows}</div>`;
  }).join("");
  openModal(`<div class="rule-page">
      ${tagChip("choice","トビラ一覧")}
      <h2>29年間に、こんなトビラがあった</h2>
      <p class="m-lead" style="text-align:left">年齢の順に、この人生にあったトビラをぜんぶ並べた。<br>出会えたトビラも、通らなかったトビラも——見えていた景色は人それぞれ。</p>
      <div class="rv-list">${secs || "<p class='m-lead'>記録がありません。</p>"}</div>
      <button class="m-btn" id="adOk">とじる</button></div>`, closeModal);
  $("adOk").onclick = closeModal;
}
$("allDoorsBtn").onclick = showAllDoorsModal;

/* ===================== rules ===================== */
const RULE_PAGES = [
  {type:"goal", tag:"めざすもの", title:"順位を決めるのは ♥ハッピー", items:[
    ["die","これは<b>16歳から45歳までの29年間</b>をたどる人生すごろく。サイコロを回して、みんなでゴールをめざそう。"],
    ["walk","<b>高校時代（16〜18歳）はサイコロを使わず、1マスずつ</b>進む。進路を選ぶ前の、準備の時間だ。"],
    ["heart","最後の順位は、おかねの多さじゃなく <b>♥ハッピーの数</b>で決まる！"],
    ["door","♥は、人生の選択「<b>トビラ</b>」を開けるともらえる。<b>♥の数＝じぶんの意思で選べた数</b>だ。"],
  ]},
  {type:"choice", tag:"トビラとカギ", title:"いい選択には「カギ」がいる", items:[
    ["door","<b>光るトビラのマス</b>に止まると、人生の選択がやってくる。"],
    ["star",`選択肢には<b>カギ</b>（必要な${ic("coin","s")}おかね・★まなび）があるものも。`],
    ["lock","カギが足りないと、そのトビラは開けられない…！"],
    ["people","えらぶ前に、<b>「なぜそれを選ぶのか」をひとこと</b>みんなに話してから決めよう。"],
  ]},
  {type:"learn", tag:"まなびとおかね", title:"★まなびは、未来のカギ", items:[
    ["book",`<b>まなびマス</b>やトビラ、${ic("bolt","s")}できごとで★まなびが貯まる。`],
    ["coin","お給料は「<b>20万＋★×10万</b>」。★が多いほど、たくさん稼げる！"],
    ["bolt","<b>できごとマス</b>では、ラッキーもアクシデントも起こる。"],
  ]},
  {type:"fam", tag:"さいごに", title:"スタート地点は、人それぞれ", items:[
    ["home","はじめに引く<b>家庭カード</b>で、持ちものやまちが変わる。"],
    ["eye","とちゅうで「？？？」の選択肢に出会うかも。それが何なのかは——遊びおわってからのお楽しみ。"],
    ["people","全員ゴールしたら<b>ふりかえりタイム</b>。感じたことを話してみよう。"],
  ]},
];
function rulePageHtml(page){
  const pg = RULE_PAGES[page];
  const items = pg.items.map(([icon,tx])=>
    `<div class="rule-item"><span class="r-ic">${ic(icon)}</span><span>${tx}</span></div>`).join("");
  const dots = RULE_PAGES.map((_,i)=>`<span class="${i===page ? "on" : ""}"></span>`).join("");
  const last = page === RULE_PAGES.length-1;
  return `<div class="rule-page">
      ${tagChip(pg.type, pg.tag)}
      <h2>${pg.title}</h2>
      <div class="rule-list">${items}</div>
      <div class="rule-dots">${dots}</div>
      <div class="rule-nav">
        ${page>0 ? '<button class="m-btn ghost" id="rulePrev">← まえ</button>' : ""}
        ${last ? "" : '<button class="m-btn ghost" id="ruleClose">とじる</button>'}
        ${last ? '<button class="m-btn" id="ruleDone">OK！</button>'
               : '<button class="m-btn" id="ruleNext">つぎへ →</button>'}
      </div></div>`;
}
/* ページをめくるたびに「つぎへ」が上下に動くと、押しまちがえる。
   ぜんぶのページを画面の外で一度だけ測って、いちばん高いページに高さをそろえる。
   （横幅が変われば測りなおす） */
let ruleH = {key:"", h:0};
function rulesMinHeight(width){
  const key = String(Math.round(width));
  if(ruleH.key === key) return ruleH.h;
  const probe = document.createElement("div");
  probe.className = "modal";
  probe.style.cssText = `position:absolute; left:-9999px; top:0; visibility:hidden;`
    + `width:${width}px; max-height:none; height:auto; overflow:visible; animation:none;`;
  document.body.appendChild(probe);
  let h = 0;
  try{
    RULE_PAGES.forEach((_,i)=>{
      probe.innerHTML = rulePageHtml(i);
      h = Math.max(h, probe.firstElementChild.offsetHeight);
    });
  }catch(e){ h = 0; }
  probe.remove();
  /* 書体がまだ読みこみ中だと高さがずれるので、そのときは覚えこまない */
  const fontsReady = !document.fonts || document.fonts.status === "loaded";
  ruleH = {key: fontsReady ? key : "", h};
  return h;
}
function renderRules(page){
  openModal(rulePageHtml(page), closeModal);
  /* 開いてから測る（モーダルの横幅が決まっていないと測れない） */
  const box = $("modalBox"), body = box.firstElementChild;
  const h = rulesMinHeight(box.getBoundingClientRect().width);
  if(h) body.style.minHeight = h + "px";
  if($("ruleClose")) $("ruleClose").onclick = closeModal;
  if($("rulePrev")) $("rulePrev").onclick = ()=>renderRules(page-1);
  if(page === RULE_PAGES.length-1) $("ruleDone").onclick = closeModal;
  else $("ruleNext").onclick = ()=>renderRules(page+1);
}
$("helpBtnSetup").onclick = ()=>renderRules(0);
$("helpBtnGame").onclick = ()=>{ if(!isOpen()) renderRules(0); };
/* 右上のタイトルボタン（モーダル表示中は無効） */
$("homeBtn").onclick = ()=>{ if(!isOpen()) showHomeConfirm(); };

initSetup();
diceFace(3);
syncSe();
