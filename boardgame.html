<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トビラ — ボードゲーム版 プロトタイプ（印刷して遊ぶ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --green:#78BE21; --crimson:#FF6858; --orange:#FFC04B; --teal:#00A3BD;
  --brown:#4A3A30; --cream:#FBF8F1; --paper:#FFFFFF; --fuji:#B58BD9; --momo:#F291B5;
}
*{box-sizing:border-box; margin:0; padding:0;}
@page{size:A4; margin:0;}
html,body{background:#8a8a8a;}
body{font-family:"Zen Maru Gothic",'Hiragino Maru Gothic ProN',sans-serif; color:var(--brown);}
.page{
  width:210mm; height:297mm; background:var(--cream); padding:10mm;
  display:flex; flex-direction:column; gap:4mm; page-break-after:always;
  -webkit-print-color-adjust:exact; print-color-adjust:exact; overflow:hidden;
}
@media screen{ .page{margin:16px auto; box-shadow:0 4px 24px rgba(0,0,0,.45);} }
@media print{ html,body{background:#fff;} .page{margin:0; box-shadow:none;} .noprint{display:none;} }

.ph{display:flex; align-items:baseline; gap:4mm; border-bottom:.8mm solid var(--brown); padding-bottom:1.5mm;}
.ph h1{font-size:15pt; font-weight:900; letter-spacing:.08em;}
.ph small{font-size:8pt; font-weight:700; opacity:.75;}
.ph .pn{margin-left:auto; font-size:8pt; font-weight:900; opacity:.5;}
.hint{font-size:8pt; line-height:1.6; font-weight:500;}
.hint b{font-weight:900;}

/* ── 盤面 ── */
.board{display:grid; grid-template-columns:repeat(6,1fr); gap:1.6mm;}
.sq{
  aspect-ratio:1/1; border:.5mm solid var(--brown); border-radius:2.5mm; background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5mm;
  font-size:6.6pt; font-weight:900; text-align:center; padding:1mm; position:relative; line-height:1.25;
}
.sq .ic{font-size:11pt; line-height:1;}
.sq .age{position:absolute; top:.8mm; left:1.4mm; font-family:DotGothic16,monospace; font-size:6pt; opacity:.55;}
.sq .amt{font-size:6.6pt; font-family:DotGothic16,monospace;}
.t-income{background:#EDF7DC; border-color:var(--green);}
.t-cost{background:#FFE9E7; border-color:var(--crimson);}
.t-event{background:#FFF3DC; border-color:var(--orange);}
.t-learn{background:#E0F4F8; border-color:var(--teal);}
.t-choice{background:var(--brown); color:var(--cream); border-color:var(--orange); border-width:.8mm;}
.t-choice .age{color:var(--orange); opacity:1;}
.t-start,.t-goal{background:var(--cream); border-width:.9mm;}
.rowdir{grid-column:1/-1; font-size:7pt; font-weight:900; color:var(--green); letter-spacing:.08em; padding-top:.6mm;}
.legend{display:flex; flex-wrap:wrap; gap:2mm; font-size:7.5pt; font-weight:700;}
.legend span{border:.4mm solid var(--brown); border-radius:99mm; padding:.6mm 3mm;}

/* ── カード共通 ── */
.cards{display:grid; gap:3mm; flex:1;}
.g2x3{grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr);}
.g3x3{grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);}
.card{
  border:.5mm dashed rgba(74,58,48,.5); border-radius:3mm; background:var(--paper);
  padding:3mm 3.5mm; display:flex; flex-direction:column; gap:1.5mm; overflow:hidden;
}
.card .ctag{
  align-self:flex-start; font-size:6.5pt; font-weight:900; color:#fff;
  border-radius:99mm; padding:.5mm 2.6mm; letter-spacing:.06em;
}
.card h3{font-size:10pt; font-weight:900; line-height:1.25;}
.card .story{font-size:7pt; line-height:1.55; opacity:.85;}
.card .rows{display:flex; flex-direction:column; gap:.8mm; font-size:7.4pt; font-weight:700; margin-top:auto;}
.card .rows span b{font-family:DotGothic16,monospace;}
.perk{background:#F3EEFA; border:.4mm solid var(--fuji); border-radius:2mm; padding:1.2mm 2mm; font-size:7pt; line-height:1.5;}
.perk b{color:#7a4fae;}
.blind{background:#FFF3DC; border:.4mm solid var(--orange); border-radius:2mm; padding:1.2mm 2mm; font-size:7pt; line-height:1.5;}

/* ── トビラカード ── */
.door h3{display:flex; align-items:baseline; gap:2mm;}
.door h3 i{font-style:normal; font-family:DotGothic16,monospace; font-size:8pt; color:var(--crimson);}
.door .body{font-size:7pt; opacity:.8; line-height:1.5;}
.opt{border-top:.3mm dotted rgba(74,58,48,.45); padding-top:1.3mm; margin-top:1.3mm; font-size:7.4pt; line-height:1.45;}
.opt .ot{font-weight:900;}
.opt .mark{color:#c77f00;}
.opt .kv{display:flex; flex-wrap:wrap; gap:1.2mm; margin-top:.8mm;}
.opt .kv em{
  font-style:normal; font-size:6.5pt; font-weight:900; border-radius:99mm; padding:.3mm 2mm;
  border:.35mm solid var(--brown); background:var(--cream); font-family:DotGothic16,monospace;
}
.opt .kv em.key{background:var(--brown); color:var(--cream);}
.opt .kv em.minus{color:#d24a3c; border-color:#d24a3c; background:#fff;}
.opt .kv em.plus{color:#5a9114; border-color:#5a9114; background:#fff;}
.opt .kv em.learn{color:#007D91; border-color:#007D91; background:#fff;}
.opt .kv em.happy{color:#c74f80; border-color:#c74f80; background:#fff;}

/* ── できごと ── */
.ev{justify-content:flex-start;}
.ev h3{font-size:8.6pt;}
.ev .story{flex:1;}

/* ── 個人ボード ── */
.pb{border:.6mm solid var(--brown); border-radius:3mm; background:var(--paper); padding:4mm; display:flex; flex-direction:column; gap:2.5mm;}
.pb h2{font-size:11pt; font-weight:900; border-bottom:.4mm dashed rgba(74,58,48,.4); padding-bottom:1.2mm;}
.track{display:flex; gap:1.5mm;}
.track div{
  flex:1; border:.5mm solid var(--brown); border-radius:2mm; background:var(--cream);
  text-align:center; padding:1.5mm .5mm; font-size:7.5pt; font-weight:900; line-height:1.4;
}
.track div b{display:block; font-family:DotGothic16,monospace; font-size:9pt; color:#5a9114;}
.track div i{display:block; font-style:normal; font-size:6.5pt; opacity:.7; font-weight:700;}
.boxes{display:flex; gap:1.5mm;}
.boxes span{
  width:9mm; height:9mm; border:.5mm solid var(--brown); border-radius:1.5mm; background:var(--cream);
  display:grid; place-items:center; font-size:6.5pt; font-weight:900; opacity:.75;
}
.pool{display:flex; gap:2mm; flex-wrap:wrap;}
.pool div{
  flex:1; min-width:38mm; border:.5mm dashed var(--brown); border-radius:2mm; padding:2mm;
  font-size:7.5pt; font-weight:700; line-height:1.6;
}

/* ── ルール ── */
.rules{display:flex; flex-direction:column; gap:2.5mm; flex:1;}
.rbox{border:.5mm solid var(--brown); border-radius:3mm; background:var(--paper); padding:2.8mm 3.5mm;}
.rbox h2{font-size:10pt; font-weight:900; margin-bottom:1.4mm; display:flex; gap:1.5mm; align-items:center;
  border-bottom:.35mm dashed rgba(74,58,48,.4); padding-bottom:1mm;}
.rbox li, .rbox p{font-size:8pt; line-height:1.6; font-weight:500;}
.rbox ul,.rbox ol{padding-left:4.5mm;}
.rbox li{margin-bottom:.6mm;}
.rbox b{font-weight:900;}
.band{background:var(--brown); color:var(--cream); border-radius:3mm; padding:2.5mm 4mm; font-size:8.5pt; font-weight:700; line-height:1.6;}
.band b{color:var(--orange);}
.tip{background:#FFF3DC; border:.4mm solid var(--orange); border-radius:2mm; padding:1.6mm 2.5mm; font-size:7.6pt; line-height:1.55; margin-top:1.4mm;}
.bar{display:flex; align-items:center; gap:2mm; font-size:9pt; font-weight:900; color:#fff; background:var(--teal); border-radius:2mm; padding:1.4mm 3mm;}

.tools{position:fixed; top:8px; right:8px; z-index:9; background:#fff; border:2px solid var(--brown);
  border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.3);}
.tools button{font-family:inherit; font-weight:900; border:none; background:var(--brown); color:#fff;
  border-radius:99px; padding:6px 14px; cursor:pointer;}
</style>
</head>
<body>
<div class="tools noprint">🖨 印刷（⌘P）で A4×8枚 <button onclick="print()">印刷</button></div>
<div id="out"></div>

<script>

 {t:"start",n:"スタート"},{t:"income",n:"初バイト",a:"+20万"},{t:"event"},{t:"learn"},{t:"choice",n:"進路"},

 {t:"learn"},{t:"income",n:"おしごと"},{t:"event"},{t:"cost",n:"まとまった出費",a:"−60万"},{t:"income",n:"おしごと"},{t:"goal",n:"ゴール"},

  ["大学・専門に進学（自費）","貯金でまなぶ。世界がひろがる","","おかね150万","−150万／★+3／♥+1"],

 {age:30,n:"海外のトビラ",b:"世界を見てみたい気持ちがふくらむ。",o:[
  ["留学・海外で働く","人生観が変わる大きな一歩","🌏","おかね150万＋★4","−150万／★+2／♥+3"],

 {age:33,n:"学びなおしのトビラ",b:"社会人からでも、学びの扉は開けなおせる。",o:[
  ["社会人入学・職業訓練で学びなおす","一度閉じた扉も、もう一度開けられる","🎗","おかね100万＋★2","−100万／★+3／♥+1"],

  ["今の道をきわめる","続けることも立派な挑戦","","―","+20万"]]},
 {age:40,n:"大きな夢のトビラ",b:"人生でいちばんやりたかったこと、覚えてる？",o:[
  ["世界一周の旅に出る","ずっと夢だったあの計画を実行","","おかね200万","−200万／♥+4"],
  ["大切な人との時間に投資","時間はお金で少し買える","","おかね100万","−100万／♥+3"],

const EVENTS=[
 ["友だちの紹介で単発バイト","人のつながりは思わぬチャンスをくれる","+30万"],

/* ===== 描画 ===== */
const el=(h)=>{const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild;};
const out=document.getElementById("out");
const page=(title,sub,pn,inner)=>el(`<div class="page">
  <div class="ph"><h1>${title}</h1><small>${sub}</small><span class="pn">${pn}</span></div>${inner}</div>`);

/* 1. 盤面 */
let board="";
for(let r=0;r<6;r++){
  board+=`<div class="rowdir">${r%2===0?"みぎへ ▶":"◀ ひだりへ"}</div>`;
  const row=[]; for(let c=0;c<6;c++) row.push(r*6+c);
  if(r%2===1) row.reverse();
  row.forEach(i=>{
    const s=SQ[i], [ic,lb]=META[s.t];
    const showAge=(s.t==="choice"||s.t==="start"||s.t==="goal");
    board+=`<div class="sq t-${s.t}">${showAge?`<span class="age">${AGES[i]}歳</span>`:""}
      <span class="ic">${ic}</span><span>${s.n||lb}</span>${s.a?`<span class="amt">${s.a}</span>`:""}</div>`;
  });
}
out.appendChild(page("🚪 トビラ ボードゲーム版","盤面（16歳→45歳の29年間）／ A4のまま使うか、A3に拡大コピー","1/8",
  `<div class="board">${board}</div>
   <div class="legend">
     <span>💰 おしごと＝給料をもらう</span><span>💸 しゅっぴ＝はらう</span><span>⚡ できごと＝カードを1枚</span>

   トビラのマスは<b>ちょうど止まったときだけ</b>そのトビラを開く（通過したときは何も起きない）。</div>`));

/* 2. 家庭カード */
out.appendChild(page("🏠 家庭カード","6枚。切って裏向きに配る（ほかの人には見せない）","2/8",
  `<div class="cards g2x3">${FAM.map(f=>`<div class="card">

/* 3-4. トビラカード */
for(let p=0;p<2;p++){
  const part=DOORS.slice(p*6,p*6+6);
  out.appendChild(page("🚪 トビラカード",`切って年齢順に重ねておく（${p+1}/2）`,`${3+p}/8`,
   `<div class="cards g2x3">${part.map(d=>`<div class="card door">
      <span class="ctag" style="background:var(--brown)">🚪 ${d.age?d.age+"歳":"まなび"}</span>
      <h3>${d.n}</h3><div class="body">${d.b}</div>
      ${d.o.map(o=>`<div class="opt">
        <div class="ot">${o[2]?`<span class="mark">${o[2]}</span> `:""}${o[0]}</div>
        <div style="opacity:.75">${o[1]}</div>
        <div class="kv"><em class="key">🔑 ${o[3]}</em>${o[4].split("／").map(x=>{
          const cls = x.includes("−")?"minus" : x.includes("★")?"learn" : x.includes("♥")?"happy" : x.includes("+")?"plus":"";
          return `<em class="${cls}">${x}</em>`;}).join("")}</div>
      </div>`).join("")}
    </div>`).join("")}</div>`));
}

/* 5-6. できごとカード */
for(let p=0;p<2;p++){

  out.appendChild(page("⚡ できごとカード",`切ってシャッフルし、山にする（${p+1}/2）／⚠️の2枚はファシリテーターの判断で外す`,`${5+p}/8`,
   `<div class="cards g3x3">${part.map(e=>`<div class="card ev">

      <div class="rows"><span style="border-top:.3mm dotted rgba(74,58,48,.5); padding-top:1.2mm">→ ${e[2]}</span></div>
    </div>`).join("")}</div>`));
}
